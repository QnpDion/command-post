function fmtTime(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function isOverdue(task) {
  if (!task.dueDate || task.status === 'done') return false;
  return task.dueDate < todayKey();
}
function fmtSize(bytes) {
  if (bytes < 1024) return bytes + ' Б';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' КБ';
  return (bytes / (1024 * 1024)).toFixed(1) + ' МБ';
}

function authErrorMessage(code) {
  const map = {
    'auth/invalid-email': 'Некоректна адреса пошти.',
    'auth/user-not-found': 'Такого користувача не знайдено.',
    'auth/wrong-password': 'Невірний пароль.',
    'auth/invalid-credential': 'Невірна пошта або пароль.',
    'auth/email-already-in-use': 'Ця пошта вже зареєстрована. Спробуй увійти.',
    'auth/weak-password': 'Пароль має містити щонайменше 6 символів.',
    'auth/too-many-requests': 'Забагато спроб. Спробуй трохи пізніше.',
  };
  return map[code] || 'Щось пішло не так. Спробуй ще раз.';
}

function LoginScreen() {
  const [mode, setMode] = useState('signin');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit() {
    setError('');
    if (!email.trim() || !password) { setError('Заповни обидва поля.'); return; }
    setBusy(true);
    try {
      if (mode === 'signin') {
        await window.__auth.signInWithEmailAndPassword(email.trim(), password);
      } else {
        await window.__auth.createUserWithEmailAndPassword(email.trim(), password);
      }
    } catch (err) {
      setError(authErrorMessage(err.code));
    } finally {
      setBusy(false);
    }
  }

  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: COLORS.bg }}>
      <div style={{ width: 320, background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 12, padding: 28 }}>
        <h1 className="org-title" style={{ fontSize: 22, fontWeight: 600, margin: '0 0 4px' }}>Командний пункт</h1>
        <p style={{ fontSize: 13, color: COLORS.muted, margin: '0 0 20px' }}>
          {mode === 'signin' ? 'Увійди у спільний простір' : 'Створи акаунт, щоб приєднатись'}
        </p>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Пошта" type="email"
            style={{ padding: '10px 12px', borderRadius: 8, border: `1px solid ${COLORS.border}`, fontSize: 14 }} />
          <input value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && submit()}
            placeholder="Пароль" type="password"
            style={{ padding: '10px 12px', borderRadius: 8, border: `1px solid ${COLORS.border}`, fontSize: 14 }} />
          {error && <div style={{ fontSize: 13, color: COLORS.danger }}>{error}</div>}
          <button onClick={submit} disabled={busy}
            style={{ padding: '10px 12px', borderRadius: 8, border: 'none', background: COLORS.task, color: '#fff', fontSize: 14, fontWeight: 600, cursor: busy ? 'default' : 'pointer', opacity: busy ? 0.7 : 1 }}>
            {busy ? 'Зачекай…' : mode === 'signin' ? 'Увійти' : 'Зареєструватися'}
          </button>
          <button onClick={() => { setMode(mode === 'signin' ? 'signup' : 'signin'); setError(''); }}
            style={{ border: 'none', background: 'none', color: COLORS.muted, fontSize: 13, cursor: 'pointer', textDecoration: 'underline' }}>
            {mode === 'signin' ? 'Ще немає акаунту? Зареєструватися' : 'Вже є акаунт? Увійти'}
          </button>
        </div>
      </div>
    </div>
  );
}

function useNotificationSetup(user, approved) {
  useEffect(() => {
    if (!user || !approved) return;
    if (!('Notification' in window)) return;
    (async () => {
      try {
        let permission = Notification.permission;
        if (permission === 'default') permission = await Notification.requestPermission();
        if (permission !== 'granted') return;
        const messaging = firebase.messaging();
        const token = await messaging.getToken({ vapidKey: window.__VAPID_KEY });
        if (token) await window.__db.collection('users').doc(user.uid).set({ fcmToken: token }, { merge: true });
        messaging.onMessage((payload) => {
          const n = payload.notification || {};
          new Notification(n.title || 'Командний пункт', { body: n.body || '' });
        });
      } catch (err) {}
    })();
  }, [user, approved]);
}

async function exportBackup() {
  const collections = ['tasks', 'messages', 'situationLog', 'shifts', 'reports', 'notes', 'users', 'auditLog'];
  const data = {};
  for (const name of collections) {
    const snap = await window.__db.collection(name).get();
    data[name] = snap.docs.map((d) => {
      const obj = { id: d.id, ...d.data() };
      Object.keys(obj).forEach((k) => {
        if (obj[k] && typeof obj[k].toDate === 'function') obj[k] = obj[k].toDate().toISOString();
      });
      return obj;
    });
  }
  data.exportedAt = new Date().toISOString();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `backup-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function ReorderList({ items, meta, hidden, onChange }) {
  function move(idx, dir) {
    const next = [...items];
    const j = idx + dir;
    if (j < 0 || j >= next.length) return;
    [next[idx], next[j]] = [next[j], next[idx]];
    onChange({ order: next, hidden });
  }
  function toggleHidden(key) {
    const next = hidden.includes(key) ? hidden.filter((k) => k !== key) : [...hidden, key];
    onChange({ order: items, hidden: next });
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      {items.map((key, idx) => (
        <div key={key} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 12px', background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 8, opacity: hidden.includes(key) ? 0.5 : 1 }}>
          <span style={{ flex: 1, fontSize: 14 }}>{meta[key] || key}</span>
          <button onClick={() => move(idx, -1)} disabled={idx === 0} style={{ border: 'none', background: 'none', cursor: idx === 0 ? 'default' : 'pointer', fontSize: 14, opacity: idx === 0 ? 0.3 : 1 }}>↑</button>
          <button onClick={() => move(idx, 1)} disabled={idx === items.length - 1} style={{ border: 'none', background: 'none', cursor: idx === items.length - 1 ? 'default' : 'pointer', fontSize: 14, opacity: idx === items.length - 1 ? 0.3 : 1 }}>↓</button>
          <button onClick={() => toggleHidden(key)} style={{ padding: '4px 10px', borderRadius: 6, border: `1px solid ${COLORS.border}`, background: '#fff', fontSize: 12, cursor: 'pointer' }}>
            {hidden.includes(key) ? 'Показати' : 'Сховати'}
          </button>
        </div>
      ))}
    </div>
  );
}

              <span style={{ flex: 1, fontSize: 14 }}>{u.nickname ? `${u.nickname} (${u.email})` : u.email || u.id}</span>

function EditableLabel({ value, onSave }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(value);

  useEffect(() => { setDraft(value); }, [value]);

  if (editing) {
    return (
      <input
        autoFocus
        value={draft}
        onChange={(e) => setDraft(e.target.value)}
        onClick={(e) => e.stopPropagation()}
        onKeyDown={(e) => {
          if (e.key === 'Enter') { onSave(draft.trim() || value); setEditing(false); }
          if (e.key === 'Escape') { setDraft(value); setEditing(false); }
        }}
        onBlur={() => { onSave(draft.trim() || value); setEditing(false); }}
        style={{ fontSize: 11, color: COLORS.muted, border: `1px solid ${COLORS.border}`, borderRadius: 4, padding: '2px 4px', width: '100%' }}
      />
    );
  }
  return (
    <div
      onClick={(e) => { e.stopPropagation(); setEditing(true); }}
      style={{ fontSize: 11, color: COLORS.muted, cursor: 'text' }}
      title="Клікни, щоб перейменувати"
    >
      {value} ✎
    </div>
  );
}

function DashboardTab({ user, isAdmin }) {
  const dir = useDirectory();
  const labels = useLabels();
  const layout = useLayout();
  const [tasks, setTasks] = useState([]);
  const [logEntries, setLogEntries] = useState([]);
  const [shifts, setShifts] = useState([]);
  const [expanded, setExpanded] = useState(null);

  useEffect(() => {
    const u1 = window.__db.collection('tasks').onSnapshot((s) => setTasks(s.docs.map((d) => ({ id: d.id, ...d.data() }))));
    const u2 = window.__db.collection('situationLog').orderBy('createdAt', 'desc').limit(5)
      .onSnapshot((s) => setLogEntries(s.docs.map((d) => ({ id: d.id, ...d.data() }))));
    const u3 = window.__db.collection('shifts').where('date', '==', todayKey())
      .onSnapshot((s) => setShifts(s.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return () => { u1(); u2(); u3(); };
  }, []);

  const counts = useMemo(() => {
    const c = { new: 0, in_progress: 0, done: 0 };
    tasks.forEach((t) => { c[t.status] = (c[t.status] || 0) + 1; });
    return c;
  }, [tasks]);

  const boxes = [
    { key: 'new', color: COLORS.info },
    { key: 'in_progress', color: COLORS.gold },
    { key: 'done', color: COLORS.task },
  ];

  async function saveLabel(key, value) {
    try {
      await window.__db.collection('config').doc('labels').set({ [key]: value }, { merge: true });
      logAudit(user.email, 'Налаштування', `Перейменовано статус "${key}" на "${value}"`);
    } catch (err) {}
  }

  const expandedTasks = useMemo(() => tasks.filter((t) => t.status === expanded), [tasks, expanded]);

  const sections = {
    stats: (
      <div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))', gap: 10, marginBottom: 16 }}>
          {boxes.map((b) => (
            <div key={b.key} onClick={() => setExpanded(expanded === b.key ? null : b.key)}
              style={{ textAlign: 'left', cursor: 'pointer', border: expanded === b.key ? `2px solid ${b.color}` : `1px solid ${COLORS.border}`, background: COLORS.surface, borderRadius: 10, padding: '12px 14px' }}>
              {isAdmin ? (
                <EditableLabel value={labels[b.key]} onSave={(v) => saveLabel(b.key, v)} />
              ) : (
                <div style={{ fontSize: 11, color: COLORS.muted }}>{labels[b.key]}</div>
              )}
              <div style={{ fontSize: 22, fontWeight: 600, color: b.color }}>{counts[b.key] || 0}</div>
            </div>
          ))}
        </div>

        {expanded && (
          <Card style={{ marginBottom: 8 }}>
            <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.muted, marginBottom: 10 }}>
              {labels[expanded]}
            </div>
            {expandedTasks.length === 0 ? (
              <div style={{ fontSize: 13, color: COLORS.muted }}>Немає завдань у цьому статусі.</div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {expandedTasks.map((t) => (
                  <div key={t.id} style={{ fontSize: 13, padding: '8px 0', borderBottom: `1px solid ${COLORS.border}` }}>
                    <div style={{ fontWeight: 600, textDecoration: t.status === 'done' ? 'line-through' : 'none', color: t.status === 'done' ? COLORS.muted : COLORS.ink }}>{t.title}</div>
                    <div style={{ color: COLORS.muted, fontSize: 12 }}>
                      {t.claimedBy ? `Виконує: ${nameFor(dir, t.claimedBy)}` : 'Ще ніхто не взяв'}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Card>
        )}
      </div>
    ),
    shift: (
      <div>
        <div style={{ fontSize: 13, fontWeight: 600, color: PAGE_MUTED, marginBottom: 10 }}>Сьогоднішня зміна</div>
        {shifts.length === 0 ? (
          <div style={{ color: PAGE_MUTED, fontSize: 14 }}>Ніхто не призначений на сьогодні.</div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {shifts.map((s) => (
              <Card key={s.id} style={{ padding: '10px 14px', fontSize: 13 }}>{s.timeRange} — {nameFor(dir, s.assignedTo)}{s.note ? ` (${s.note})` : ''}</Card>
            ))}
          </div>
        )}
      </div>
    ),
    log: (
      <div>
        <div style={{ fontSize: 13, fontWeight: 600, color: PAGE_MUTED, marginBottom: 10 }}>Останні записи журналу</div>
        {logEntries.length === 0 ? (
          <div style={{ color: PAGE_MUTED, fontSize: 14 }}>Записів ще немає.</div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {logEntries.map((e) => (
              <Card key={e.id} style={{ padding: '10px 14px', fontSize: 13 }}>
                <div style={{ color: COLORS.muted, fontSize: 11, marginBottom: 2 }}>{fmtTime(e.createdAt)} · {nameFor(dir, e.author)}</div>
                {e.text}
              </Card>
            ))}
          </div>
        )}
      </div>
    ),
  };

  const order = [...layout.dashboardOrder, ...Object.keys(DASHBOARD_SECTION_META).filter((k) => !layout.dashboardOrder.includes(k))];
  const visibleOrder = order.filter((k) => !layout.hiddenDashboard.includes(k) && sections[k]);

  return (
    <div>
      {visibleOrder.map((key, i) => (
        <div key={key} style={{ marginBottom: i < visibleOrder.length - 1 ? 24 : 0 }}>{sections[key]}</div>
      ))}
    </div>
  );
}

function SituationLogTab({ user, isAdmin }) {
  const dir = useDirectory();
  const theme = useTheme();
  const [entries, setEntries] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [text, setText] = useState('');
  const [query, setQuery] = useState('');

  useEffect(() => {
    const unsub = window.__db.collection('situationLog').orderBy('createdAt', 'desc')
      .onSnapshot((snap) => { setEntries(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoaded(true); }, () => setLoaded(true));
    return unsub;
  }, []);

  async function addEntry() {
    const t = text.trim();
    if (!t) return;
    setText('');
    await window.__db.collection('situationLog').add({ text: t, author: user.email, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    logAudit(user.email, 'Журнал обстановки', t.slice(0, 60));
  }

  async function deleteEntry(id) {
    await window.__db.collection('situationLog').doc(id).delete();
    logAudit(user.email, 'Журнал обстановки', 'Видалено запис');
  }

  async function clearAll() {
    if (!window.confirm('Видалити всі записи журналу без можливості відновлення?')) return;
    const snap = await window.__db.collection('situationLog').get();
    const batch = window.__db.batch();
    snap.docs.forEach((d) => batch.delete(d.ref));
    await batch.commit();
    logAudit(user.email, 'Журнал обстановки', 'Очищено весь журнал');
  }

  const filtered = useMemo(() => {
    if (!query.trim()) return entries;
    const q = query.toLowerCase();
    return entries.filter((e) => (e.text || '').toLowerCase().includes(q) || (e.author || '').toLowerCase().includes(q));
  }, [entries, query]);

  if (!loaded) return <div style={{ color: COLORS.muted, fontSize: 14 }}>Завантаження…</div>;

  return (
    <div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Новий запис у журнал обстановки…"
          style={{ flex: 1, padding: '9px 12px', borderRadius: 8, border: `1px solid ${COLORS.border}`, fontSize: 14, minHeight: 60, resize: 'vertical' }} />
        <button onClick={addEntry} style={{ padding: '9px 18px', borderRadius: 8, border: 'none', background: theme.accent, color: '#fff', fontSize: 14, fontWeight: 600, cursor: 'pointer', alignSelf: 'flex-start' }}>Додати</button>
      </div>
      <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 14 }}>
        <div style={{ flex: 1 }}><SearchBox value={query} onChange={setQuery} placeholder="Пошук у журналі…" /></div>
        {isAdmin && entries.length > 0 && (
          <button onClick={clearAll} style={{ padding: '9px 14px', borderRadius: 8, border: `1px solid ${COLORS.danger}`, background: '#fff', color: COLORS.danger, fontSize: 13, cursor: 'pointer', marginBottom: 14 }}>
            Очистити журнал
          </button>
        )}
      </div>
      {filtered.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '30px 0', color: COLORS.muted, fontSize: 14 }}>Записів немає.</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {filtered.map((e) => (
            <Card key={e.id}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
                <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 4 }}>{fmtTime(e.createdAt)} · {nameFor(dir, e.author)}</div>
                {(e.author === user.email || isAdmin) && (
                  <button onClick={() => deleteEntry(e.id)} style={{ border: 'none', background: 'none', color: COLORS.danger, cursor: 'pointer', fontSize: 16 }}>×</button>
                )}
              </div>
              <div style={{ fontSize: 14 }}>{e.text}</div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

function NotesTab({ user }) {
  const dir = useDirectory();
  const theme = useTheme();
  const [notes, setNotes] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [title, setTitle] = useState('');
  const [content, setContent] = useState('');
  const [showForm, setShowForm] = useState(false);
  const [query, setQuery] = useState('');

  useEffect(() => {
    const unsub = window.__db.collection('notes').orderBy('createdAt', 'desc')
      .onSnapshot((snap) => { setNotes(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoaded(true); }, () => setLoaded(true));
    return unsub;
  }, []);

  async function addNote() {
    const t = title.trim();
    const c = content.trim();
    if (!t && !c) return;
    await window.__db.collection('notes').add({
      title: t || 'Без назви', content: c, author: user.email, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    logAudit(user.email, 'Нотатка', t || c.slice(0, 40));
    setTitle(''); setContent(''); setShowForm(false);
  }

  async function deleteNote(id) {
    await window.__db.collection('notes').doc(id).delete();
  }

  const filtered = useMemo(() => {
    if (!query.trim()) return notes;
    const q = query.toLowerCase();
    return notes.filter((n) => (n.title || '').toLowerCase().includes(q) || (n.content || '').toLowerCase().includes(q));
  }, [notes, query]);

  function linkify(text) {
    const parts = text.split(/(https?:\/\/[^\s]+)/g);
    return parts.map((part, i) =>
      /^https?:\/\//.test(part) ? (
        <a key={i} href={part} target="_blank" rel="noreferrer" style={{ color: COLORS.info }}>{part}</a>
      ) : (
        part
      )
    );
  }

  if (!loaded) return <div style={{ color: COLORS.muted, fontSize: 14 }}>Завантаження…</div>;

  return (
    <div>
      <button onClick={() => setShowForm((v) => !v)}
        style={{ padding: '10px 16px', borderRadius: 8, border: 'none', background: theme.accent, color: '#fff', fontSize: 14, fontWeight: 600, cursor: 'pointer', marginBottom: 16 }}>
        {showForm ? 'Скасувати' : '+ Нова нотатка'}
      </button>

      {showForm && (
        <Card style={{ marginBottom: 20, display: 'flex', flexDirection: 'column', gap: 8 }}>
          <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Назва (напр. Контакти постачальника)"
            style={{ padding: '9px 10px', borderRadius: 8, border: `1px solid ${COLORS.border}`, fontSize: 14 }} />
          <textarea value={content} onChange={(e) => setContent(e.target.value)} placeholder="Текст, посилання, інформація…"
            style={{ padding: '9px 10px', borderRadius: 8, border: `1px solid ${COLORS.border}`, fontSize: 14, minHeight: 90, resize: 'vertical' }} />
          <button onClick={addNote} style={{ padding: '9px 18px', borderRadius: 8, border: 'none', background: theme.accent, color: '#fff', fontSize: 14, fontWeight: 600, cursor: 'pointer', alignSelf: 'flex-start' }}>
            Зберегти
          </button>
        </Card>
      )}

      <SearchBox value={query} onChange={setQuery} placeholder="Пошук нотаток…" />

      {filtered.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '30px 0', color: COLORS.muted, fontSize: 14 }}>Нотаток ще немає.</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {filtered.map((n) => (
            <Card key={n.id}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8, marginBottom: 6 }}>
                <div style={{ fontSize: 15, fontWeight: 600 }}>{n.title}</div>
                {(n.author === user.email || user.email === ADMIN_EMAIL) && (
                  <button onClick={() => deleteNote(n.id)} style={{ border: 'none', background: 'none', color: COLORS.danger, cursor: 'pointer', fontSize: 16 }}>×</button>
                )}
              </div>
              <div style={{ fontSize: 13, whiteSpace: 'pre-wrap', marginBottom: 6 }}>{linkify(n.content)}</div>
              <div style={{ fontSize: 11, color: COLORS.muted }}>{nameFor(dir, n.author)} · {fmtTime(n.createdAt)}</div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

        <div style={{ textAlign: 'center', padding: '30px 0', color: COLORS.muted, fontSize: 14 }}>Доповідей ще немає.</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {reports.map((r) => (
            <Card key={r.id}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8 }}>
                <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 4 }}>{fmtTime(r.createdAt)} · {nameFor(dir, r.author)}</div>
                {(r.author === user.email || isAdmin) && (
                  <button onClick={() => deleteReport(r.id)} style={{ border: 'none', background: 'none', color: COLORS.danger, cursor: 'pointer', fontSize: 16 }}>×</button>
                )}
              </div>
              <div style={{ fontSize: 14, whiteSpace: 'pre-wrap' }}>{r.summary}</div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

function FilesTab({ user }) {
  const dir = useDirectory();
  const [files, setFiles] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [error, setError] = useState('');
  const inputRef = useRef(null);

  const load = useCallback(async () => {
    try {
      const listRef = window.__storage.ref('files');
      const res = await listRef.listAll();
      const items = await Promise.all(res.items.map(async (itemRef) => {
        const [meta, url] = await Promise.all([itemRef.getMetadata(), itemRef.getDownloadURL()]);
        return { name: itemRef.name, fullPath: itemRef.fullPath, size: meta.size, uploader: (meta.customMetadata && meta.customMetadata.uploader) || '—', timeCreated: meta.timeCreated, url };
      }));
      items.sort((a, b) => new Date(b.timeCreated) - new Date(a.timeCreated));
      setFiles(items);
    } catch (err) { setError('Не вдалося завантажити список файлів.'); setFiles([]); }
  }, []);

  useEffect(() => { load(); }, [load]);

  async function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    setError('');
    try {
      const path = `files/${Date.now()}_${file.name}`;
      const ref = window.__storage.ref(path);
      await ref.put(file, { customMetadata: { uploader: user.email } });
      await logAudit(user.email, 'Файл', `Завантажено: ${file.name}`);
      await load();
    } catch (err) {
      setError('Не вдалося завантажити файл.');
    } finally {
      setUploading(false);
      if (inputRef.current) inputRef.current.value = '';
    }
  }

  async function handleDelete(f) {
    try {
      await window.__storage.ref(f.fullPath).delete();
      await logAudit(user.email, 'Файл', `Видалено: ${f.name}`);
      setFiles((prev) => prev.filter((x) => x.fullPath !== f.fullPath));
    } catch (err) { setError('Не вдалося видалити файл.'); }
  }

  return (
    <div>
      <Card style={{ marginBottom: 20 }}>
        <input ref={inputRef} type="file" onChange={handleUpload} disabled={uploading} style={{ fontSize: 13 }} />
        {uploading && <div style={{ fontSize: 13, color: COLORS.muted, marginTop: 8 }}>Завантаження…</div>}
        {error && <div style={{ fontSize: 13, color: COLORS.danger, marginTop: 8 }}>{error}</div>}
      </Card>

      {files === null ? (
        <div style={{ color: COLORS.muted, fontSize: 14 }}>Завантаження…</div>
      ) : files.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '30px 0', color: COLORS.muted, fontSize: 14 }}>Файлів ще немає.</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {files.map((f) => (
            <div key={f.fullPath} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '10px 14px', background: COLORS.surface, border: `1px solid ${COLORS.border}`, borderRadius: 8, fontSize: 13, flexWrap: 'wrap' }}>
              <a href={f.url} target="_blank" rel="noreferrer" style={{ color: COLORS.info, fontWeight: 600, textDecoration: 'none' }}>{f.name}</a>
              <span style={{ color: COLORS.muted }}>{fmtSize(f.size)}</span>
              <span style={{ color: COLORS.muted }}>{nameFor(dir, f.uploader)}</span>
              <span style={{ color: COLORS.muted, marginLeft: 'auto' }}>{new Date(f.timeCreated).toLocaleDateString('uk-UA')}</span>
              {(f.uploader === user.email || user.email === ADMIN_EMAIL) && (
                <button onClick={() => handleDelete(f)} style={{ border: 'none', background: 'none', color: COLORS.danger, cursor: 'pointer', fontSize: 16 }}>×</button>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TasksTab({ user, isAdmin }) {
  const dir = useDirectory();
  const labels = useLabels();
  const theme = useTheme();
  const [tasks, setTasks] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [title, setTitle] = useState('');
  const [description, setDescription] = useState('');
  const [dueDate, setDueDate] = useState('');
  const [showForm, setShowForm] = useState(false);
  const [query, setQuery] = useState('');
  const [assigningId, setAssigningId] = useState(null);
  const [assignTarget, setAssignTarget] = useState('');

  useEffect(() => {
    const unsub = window.__db.collection('tasks').orderBy('createdAt', 'desc')
      .onSnapshot((snap) => { setTasks(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); setLoaded(true); }, () => setLoaded(true));
    return unsub;
  }, []);

  const approvedUsers = useMemo(
    () => Object.entries(dir).filter(([, v]) => v.approved).map(([email, v]) => ({ email, nickname: v.nickname })),
    [dir]
  );

  async function createTask() {
    const t = title.trim();
    if (!t) return;
    await window.__db.collection('tasks').add({
      title: t, description: description.trim(), dueDate: dueDate || null, status: 'new',
      createdBy: user.email, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      claimedBy: null, claimedAt: null, completedAt: null,
    });
    logAudit(user.email, 'Створено завдання', t);
    setTitle(''); setDescription(''); setDueDate(''); setShowForm(false);
  }

  async function claimTask(task) {
    await window.__db.collection('tasks').doc(task.id).set({ status: 'in_progress', claimedBy: user.email, claimedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    logAudit(user.email, 'Взято завдання', task.title);
  }
  async function assignTask(task, targetEmail) {
    if (!targetEmail) return;
    await window.__db.collection('tasks').doc(task.id).set({ status: 'in_progress', claimedBy: targetEmail, claimedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    logAudit(user.email, 'Призначено завдання', `${task.title} → ${nameFor(dir, targetEmail)}`);
    setAssigningId(null);
    setAssignTarget('');
  }
  async function completeTask(task) {
    await window.__db.collection('tasks').doc(task.id).set({ status: 'done', completedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
    logAudit(user.email, 'Виконано завдання', task.title);
  }
  async function reopenTask(task) {
    await window.__db.collection('tasks').doc(task.id).set({ status: 'new', claimedBy: null, claimedAt: null, completedAt: null }, { merge: true });
    logAudit(user.email, 'Повернуто завдання', task.title);
  }
  async function deleteTask(task) {
    await window.__db.collection('tasks').doc(task.id).delete();
    logAudit(user.email, 'Видалено завдання', task.title);
  }

  const filtered = useMemo(() => {
    if (!query.trim()) return tasks;
    const q = query.toLowerCase();
    return tasks.filter((t) => (t.title || '').toLowerCase().includes(q) || (t.description || '').toLowerCase().includes(q));
  }, [tasks, query]);

  if (!loaded) return <div style={{ color: COLORS.muted, fontSize: 14 }}>Завантаження…</div>;

  return (
    <div>
      <button onClick={() => setShowForm((v) => !v)}
        style={{ padding: '10px 16px', borderRadius: 8, border: 'none', background: theme.accent, color: '#fff', fontSize: 14, fontWeight: 600, cursor: 'pointer', marginBottom: 16 }}>
        {showForm ? 'Скасувати' : '+ Нове завдання'}
      </button>

      {showForm && (
        <Card style={{ marginBottom: 20, display: 'flex', flexDirection: 'column', gap: 8 }}>
          <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Назва завдання"
            style={{ padding: '9px 10px', borderRadius: 8, border: `1px solid ${COLORS.border}`, fontSize: 14 }} />
          <textarea value={description} onChange={(e) => setDescription(e.target.value)} placeholder="Опис (необов'язково)"
            style={{ padding: '9px 10px', borderRadius: 8, border: `1px solid ${COLORS.border}`, fontSize: 14, minHeight: 70, resize: 'vertical' }} />
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            <label style={{ fontSize: 12, color: COLORS.muted }}>Термін:</label>
            <input type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)}
              style={{ padding: '7px 10px', borderRadius: 8, border: `1px solid ${COLORS.border}`, fontSize: 13 }} />
            <button onClick={createTask} style={{ marginLeft: 'auto', padding: '9px 18px', borderRadius: 8, border: 'none', background: theme.accent, color: '#fff', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>
              Створити
            </button>
          </div>
        </Card>
      )}

      <SearchBox value={query} onChange={setQuery} placeholder="Пошук завдань…" />

      {filtered.length === 0 ? (
        <div style={{ textAlign: 'center', padding: '40px 0', color: COLORS.muted, fontSize: 14 }}>Завдань не знайдено.</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {filtered.map((t) => {
            const sc = STATUS_COLOR[t.status] || STATUS_COLOR.new;
            const mine = t.claimedBy === user.email;
            const overdue = isOverdue(t);
            const done = t.status === 'done';
            return (
              <Card key={t.id} style={overdue && !done ? { borderColor: COLORS.danger } : undefined}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8, marginBottom: 6 }}>
                  <div style={{ fontSize: 15, fontWeight: 600, textDecoration: done ? 'line-through' : 'none', color: done ? COLORS.muted : COLORS.ink }}>{t.title}</div>
                  <div style={{ display: 'flex', gap: 6 }}>
                    {overdue && !done && <span style={{ padding: '2px 8px', borderRadius: 6, fontSize: 11, fontWeight: 600, background: COLORS.dangerLight, color: COLORS.danger }}>Прострочено</span>}
                    <span style={{ padding: '2px 8px', borderRadius: 6, fontSize: 11, fontWeight: 600, background: sc.bg, color: sc.fg, whiteSpace: 'nowrap' }}>{labels[t.status] || t.status}</span>
                  </div>
                </div>
                {t.description && <div style={{ fontSize: 13, color: COLORS.muted, marginBottom: 8, textDecoration: done ? 'line-through' : 'none' }}>{t.description}</div>}
                <div style={{ fontSize: 12, color: COLORS.muted, marginBottom: 10, display: 'flex', flexWrap: 'wrap', gap: 12 }}>
                  <span>Створив: {nameFor(dir, t.createdBy)}</span>
                  <span>Створено: {fmtTime(t.createdAt)}</span>
                  {t.claimedBy && <span>Виконує: {nameFor(dir, t.claimedBy)} ({fmtTime(t.claimedAt)})</span>}
                  {t.completedAt && <span>Виконано: {fmtTime(t.completedAt)}</span>}
                  {t.dueDate && <span>Термін: {t.dueDate}</span>}
                </div>

                {assigningId === t.id && (
                  <div style={{ display: 'flex', gap: 8, marginBottom: 10, flexWrap: 'wrap' }}>
                    <select value={assignTarget} onChange={(e) => setAssignTarget(e.target.value)}
                      style={{ padding: '6px 10px', borderRadius: 6, border: `1px solid ${COLORS.border}`, fontSize: 12 }}>
                      <option value="">Обери людину…</option>
                      {approvedUsers.map((u) => (
                        <option key={u.email} value={u.email}>{u.nickname || u.email}</option>
                      ))}
                    </select>
                    <button onClick={() => assignTask(t, assignTarget)} style={{ padding: '6px 12px', borderRadius: 6, border: 'none', background: COLORS.task, color: '#fff', fontSize: 12, cursor: 'pointer' }}>Призначити</button>
                    <button onClick={() => setAssigningId(null)} style={{ padding: '6px 12px', borderRadius: 6, border: `1px solid ${COLORS.border}`, background: '#fff', fontSize: 12, cursor: 'pointer' }}>Скасувати</button>
                  </div>
                )}

                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                  {t.status === 'new' && <button onClick={() => claimTask(t)} style={{ padding: '6px 14px', borderRadius: 6, border: 'none', background: COLORS.info, color: '#fff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Взяти в роботу</button>}
                  {t.status === 'new' && isAdmin && assigningId !== t.id && (
                    <button onClick={() => { setAssigningId(t.id); setAssignTarget(''); }} style={{ padding: '6px 14px', borderRadius: 6, border: `1px solid ${COLORS.border}`, background: '#fff', fontSize: 12, cursor: 'pointer' }}>Призначити…</button>
                  )}
                  {t.status === 'in_progress' && mine && <button onClick={() => completeTask(t)} style={{ padding: '6px 14px', borderRadius: 6, border: 'none', background: COLORS.task, color: '#fff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Позначити виконаним</button>}
                  {t.status !== 'new' && (mine || isAdmin) && <button onClick={() => reopenTask(t)} style={{ padding: '6px 14px', borderRadius: 6, border: `1px solid ${COLORS.border}`, background: '#fff', fontSize: 12, cursor: 'pointer' }}>Повернути</button>}
                  {(t.createdBy === user.email || isAdmin) && <button onClick={() => deleteTask(t)} style={{ padding: '6px 14px', borderRadius: 6, border: 'none', background: 'none', color: COLORS.danger, fontSize: 12, cursor: 'pointer' }}>Видалити</button>}
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ChatTab({ user, isAdmin }) {
  const dir = useDirectory();
  const theme = useTheme();
  const [messages, setMessages] = useState([]);
  const [text, setText] = useState('');
  const bottomRef = useRef(null);

  useEffect(() => {
    const unsub = window.__db.collection('messages').orderBy('createdAt', 'asc').limitToLast(200)
      .onSnapshot((snap) => setMessages(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    return unsub;
  }, []);
  useEffect(() => { bottomRef.current && bottomRef.current.scrollIntoView({ block: 'end' }); }, [messages.length]);

  async function send() {
    const t = text.trim();
    if (!t) return;
    setText('');
    await window.__db.collection('messages').add({ text: t, senderEmail: user.email, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  }

  async function deleteMessage(id) {
    await window.__db.collection('messages').doc(id).delete();
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: 500 }}>
      <div style={{ flex: 1, overflowY: 'auto', border: `1px solid ${COLORS.border}`, borderRadius: 10, background: COLORS.surface, padding: 14, display: 'flex', flexDirection: 'column', gap: 10 }}>
        {messages.length === 0 && <div style={{ color: COLORS.muted, fontSize: 14, textAlign: 'center', marginTop: 20 }}>Повідомлень ще немає.</div>}
        {messages.map((m) => {
          const mine = m.senderEmail === user.email;
          return (
            <div key={m.id} style={{ alignSelf: mine ? 'flex-end' : 'flex-start', maxWidth: '75%' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, justifyContent: mine ? 'flex-end' : 'flex-start' }}>
                <div style={{ fontSize: 11, color: COLORS.muted, marginBottom: 2 }}>{mine ? 'Ти' : nameFor(dir, m.senderEmail)} · {fmtTime(m.createdAt)}</div>
                {(mine || isAdmin) && (
                  <button onClick={() => deleteMessage(m.id)} style={{ border: 'none', background: 'none', color: COLORS.muted, cursor: 'pointer', fontSize: 13, padding: 0 }}>×</button>
                )}
              </div>
              <div style={{ background: mine ? theme.light : COLORS.bg, borderRadius: 10, padding: '8px 12px', fontSize: 14 }}>{m.text}</div>
            </div>
          );
        })}
        <div ref={bottomRef} />
      </div>
      <div style={{ display: 'flex', gap: 8, marginTop: 10 }}>
        <input value={text} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && send()} placeholder="Повідомлення…"
          style={{ flex: 1, padding: '10px 14px', borderRadius: 8, border: `1px solid ${COLORS.border}`, fontSize: 14 }} />
        <button onClick={send} style={{ padding: '10px 18px', borderRadius: 8, border: 'none', background: theme.accent, color: '#fff', fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>Надіслати</button>
      </div>
    </div>
  );
}

function Board({ user, isAdmin }) {
  const [tab, setTab] = useState('dashboard');
  const [directory, setDirectory] = useState({});
  const [labels, setLabels] = useState(DEFAULT_LABELS);
  const [layout, setLayout] = useState(DEFAULT_LAYOUT);
  useNotificationSetup(user, true);

  useEffect(() => {
    const unsub = window.__db.collection('users').onSnapshot((snap) => {
      const map = {};
      snap.forEach((d) => {
        const data = d.data();
        if (data.email) map[data.email] = { nickname: data.nickname, approved: !!data.approved, themeAccent: data.themeAccent };
      });
      setDirectory(map);
    });
    return unsub;
  }, []);

  useEffect(() => {
    const unsub = window.__db.collection('config').doc('labels').onSnapshot((snap) => {
      if (snap.exists) setLabels({ ...DEFAULT_LABELS, ...snap.data() });
    });
    return unsub;
  }, []);

  useEffect(() => {
    const unsub = window.__db.collection('config').doc('layout').onSnapshot((snap) => {
      if (snap.exists) setLayout({ ...DEFAULT_LAYOUT, ...snap.data() });
    });
    return unsub;
  }, []);

  const myAccentHex = (directory[user.email] && directory[user.email].themeAccent) || DEFAULT_ACCENT.accent;
  const theme = accentByHex(myAccentHex);

  const orderedKeys = [...layout.tabOrder, ...Object.keys(TAB_META).filter((k) => !layout.tabOrder.includes(k))]
    .filter((k) => TAB_META[k] && !layout.hiddenTabs.includes(k));
  const tabs = orderedKeys.map((k) => ({ key: k, label: TAB_META[k] }));
  tabs.push({ key: 'profile', label: 'Профіль' });
  if (isAdmin) {
    tabs.push({ key: 'layout', label: 'Вигляд' });
    tabs.push({ key: 'admin', label: 'Учасники' });
  }

  return (
    <UserDirectoryContext.Provider value={directory}>
      <LabelsContext.Provider value={labels}>
        <LayoutContext.Provider value={layout}>
        <ThemeContext.Provider value={theme}>
        <div style={{ background: COLORS.bg, minHeight: '100vh' }}>
          <div style={{ maxWidth: 920, margin: '0 auto', padding: '32px 20px 60px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', flexWrap: 'wrap', gap: 8 }}>
              {isAdmin ? (
                <EditableTitle value={labels.appTitle} onSave={async (v) => {
                  await window.__db.collection('config').doc('labels').set({ appTitle: v }, { merge: true });
                  logAudit(user.email, 'Налаштування', `Перейменовано застосунок на "${v}"`);
                }} />
              ) : (
                <h1 className="org-title" style={{ fontSize: 26, fontWeight: 600, margin: 0, color: PAGE_TEXT }}>{labels.appTitle}</h1>
              )}
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <span style={{ fontSize: 13, color: PAGE_MUTED }}>{nameFor(directory, user.email)}</span>
                <button onClick={() => window.__auth.signOut()} style={{ border: 'none', background: 'none', color: PAGE_MUTED, fontSize: 13, cursor: 'pointer', textDecoration: 'underline' }}>Вийти</button>
              </div>
            </div>

            <div style={{ display: 'flex', gap: 18, borderBottom: `1px solid ${COLORS.border}`, marginTop: 20, marginBottom: 28, flexWrap: 'wrap' }}>
              {tabs.map((t) => (
                <button key={t.key} onClick={() => setTab(t.key)} style={{
                  background: 'none', border: 'none',
                  borderBottom: tab === t.key ? `2px solid ${theme.accent}` : '2px solid transparent',
                  padding: '10px 2px', fontSize: 14, fontWeight: tab === t.key ? 600 : 400,
                  color: tab === t.key ? PAGE_TEXT : PAGE_MUTED, cursor: 'pointer', marginBottom: -1,
                }}>{t.label}</button>
              ))}
            </div>

            {tab === 'dashboard' && <DashboardTab user={user} isAdmin={isAdmin} />}
            {tab === 'log' && <SituationLogTab user={user} isAdmin={isAdmin} />}
            {tab === 'tasks' && <TasksTab user={user} isAdmin={isAdmin} />}
            {tab === 'shifts' && <ShiftsTab user={user} />}
            {tab === 'reports' && <ReportsTab user={user} isAdmin={isAdmin} />}
            {tab === 'notes' && <NotesTab user={user} />}
            {tab === 'files' && <FilesTab user={user} />}
            {tab === 'chat' && <ChatTab user={user} isAdmin={isAdmin} />}
            {tab === 'profile' && <ProfileTab user={user} />}
            {tab === 'layout' && isAdmin && <LayoutTab user={user} />}
            {tab === 'admin' && isAdmin && <AdminTab />}
          </div>
        </div>
        </ThemeContext.Provider>
        </LayoutContext.Provider>
      </LabelsContext.Provider>
    </UserDirectoryContext.Provider>
  );
}

function Root() {
  const [user, setUser] = useState(undefined);
  const [approved, setApproved] = useState(null);

  useEffect(() => {
    const unsub = window.__auth.onAuthStateChanged(async (u) => {
      if (!u) { setUser(null); setApproved(null); return; }
      const isAdmin = u.email === ADMIN_EMAIL;
      const ref = window.__db.collection('users').doc(u.uid);
      try {
        const snap = await ref.get();
        if (!snap.exists) {
          await ref.set({ email: u.email, approved: isAdmin });
          setApproved(isAdmin);
        } else {
          const data = snap.data();
          setApproved(isAdmin ? true : !!data.approved);
        }
      } catch (err) { setApproved(false); }
      setUser(u);
    });
    return unsub;
  }, []);

  if (user === undefined) return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: COLORS.bg, color: COLORS.muted }}>Завантаження…</div>;
  if (!user) return <LoginScreen />;
  if (approved === null) return <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: COLORS.bg, color: COLORS.muted }}>Завантаження…</div>;
  if (!approved) return <PendingScreen email={user.email} />;
  return <Board user={user} isAdmin={user.email === ADMIN_EMAIL} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
